<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Combat Prototype (Milestone 1)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1016; overflow: hidden; font-family: system-ui, sans-serif; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; color: #f4f1e8; user-select: none; }
      #ui [hidden] { display: none !important; }

      .boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0b1016; }
      .boot-text { font-size: 18px; letter-spacing: 0.04em; opacity: 0.85; }
      .boot-bar { width: min(360px, 70vw); height: 8px; background: #26303b; border-radius: 4px; overflow: hidden; }
      .boot-fill { height: 100%; width: 0; background: #d9a441; transition: width 0.15s; }
      .error { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: #0b1016; color: #ff8a80; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 14px; }

      .bars, .numbers { position: absolute; inset: 0; }
      .bar { position: absolute; left: 0; top: 0; width: 64px; height: 7px; margin-left: -32px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 0, 0, 0.8); border-radius: 3px; overflow: hidden; }
      .bar-fill { height: 100%; width: 100%; }
      .bar.team-player .bar-fill { background: #5fb3ff; }
      .bar.team-enemy .bar-fill { background: #ef6a5a; }
      .num { position: absolute; left: 0; top: 0; font-weight: 800; font-size: 20px; color: #ffe27a; text-shadow: 0 2px 0 #000, 0 0 6px #000; transform: translate(-50%, -50%); white-space: nowrap; }

      .crosshair { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.7); }
      .draw { position: absolute; left: 50%; top: calc(50% + 22px); width: 120px; height: 6px; margin-left: -60px; background: rgba(0,0,0,0.55); border-radius: 3px; overflow: hidden; }
      .draw-fill { height: 100%; width: 0; background: #d9a441; }

      .hero { position: absolute; left: 24px; bottom: 60px; width: 260px; }
      .hero-label { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; margin-bottom: 6px; }
      .hp { position: relative; height: 18px; background: rgba(0,0,0,0.55); border: 1px solid rgba(0,0,0,0.8); border-radius: 4px; overflow: hidden; }
      .hp-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#7fd66b, #3f9a3a); transition: width 0.1s; }
      .hp-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px #000; }

      .weapon { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 14px; font-size: 14px; }
      .weapon span { padding: 4px 10px; border-radius: 4px; background: rgba(0,0,0,0.5); opacity: 0.6; }
      .weapon span.active { opacity: 1; background: #d9a441; color: #1b1407; font-weight: 700; }

      .panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5, 8, 12, 0.6); }
      .card { background: rgba(16, 22, 30, 0.94); border: 1px solid #3a4756; border-radius: 10px; padding: 28px 36px; max-width: 520px; text-align: center; line-height: 1.5; }
      .card h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: 0.04em; }
      .card p { margin: 6px 0; opacity: 0.9; }
      .card .keys { text-align: left; font-size: 14px; opacity: 0.85; margin: 16px auto 0; display: inline-block; }
      .card .keys b { display: inline-block; min-width: 110px; color: #d9a441; }
      .card button { pointer-events: auto; margin-top: 18px; padding: 10px 26px; font-size: 16px; font-weight: 700; border: 0; border-radius: 6px; background: #d9a441; color: #1b1407; cursor: pointer; }
      .victory h1 { color: #9be38a; }
      .defeat h1 { color: #ff8a80; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
